// =====================================================================
//  server_cp.cfg  -  CAMPAIGN CO-OP (t7x)
//  Aligned with the maintained t7x server config (lobby-based startup).
//  Values written as ${NAME} are injected from .env at startup.
//
//  To run campaign co-op: set SERVER_CFG=server_cp.cfg in .env
//  (or use switch.sh cp).
// =====================================================================

// --- Server identity --------------------------------------------------
set sv_hostname "${SERVER_NAME}"
set live_steam_server_name "${SERVER_NAME}"
set live_steam_server_description "${SERVER_DESCRIPTION}"
set g_password "${SERVER_PASSWORD}"
set rcon_password "${RCON_PASSWORD}"

// --- Session / networking (campaign co-op is 1-4 players) ------------
set com_maxclients "4"
set sv_maxclients "4"
set sv_privateClients "0"
set sv_lobby_mode "cp"
set sv_skip_lobby "1"
set sv_lanonly "0"
set sv_pure "0"
set sv_timeout "30"
set sv_reconnectlimit "3"
set sv_floodProtect "1"
set g_log "logs/games_cp.log"

// --- Campaign rules (leave these execs as-is) ------------------------
exec "gamedata/gamesettings/cp/gamesettings_default.cfg"
exec "gamedata/configs/common/default_xboxlive.cfg"
exec "gamedata/gamesettings/cp/gamesettings_coop.cfg"

// --- Starting mission -------------------------------------------------
// cp_mi_eth_prologue = the first campaign mission (Black Ops).
set sv_maprotation "gametype coop map cp_mi_eth_prologue"
