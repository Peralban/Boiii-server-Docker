// =====================================================================
//  server.cfg  -  MULTIPLAYER (BO3 / custom client)
//
//  Values written as ${NAME} are injected from your .env file at startup,
//  so no password is ever committed to this file.
//
//  Edit this file from the host, then apply with:
//      docker compose restart bo3
// =====================================================================

// --- Server identity (shown in the server browser) -------------------
set sv_hostname "${SERVER_NAME}"
set live_steam_server_name "${SERVER_NAME}"
set live_steam_server_description "${SERVER_DESCRIPTION}"

// Password required to join (empty = open server)
set g_password "${SERVER_PASSWORD}"

// --- Remote administration (RCON) ------------------------------------
set rcon_password "${RCON_PASSWORD}"

// --- Players ----------------------------------------------------------
set sv_maxclients "${MAX_PLAYERS}"
set party_maxplayers "${MAX_PLAYERS}"

// --- Game mode and starting map --------------------------------------
// Common modes: tdm (team deathmatch), dom (domination), dm (free-for-all),
//               sd (search & destroy), hp (hardpoint), conf (confirmed)
set g_gametype "tdm"
map mp_veiled

// --- Map rotation -----------------------------------------------------
// Chains mode + map. Adjust to the maps you actually have.
set sv_maprotation "gametype tdm map mp_veiled gametype dom map mp_infection gametype tdm map mp_havoc"

// --- Misc -------------------------------------------------------------
// sv_maxRate must be between 1000 and 50000 (0 is rejected by the server)
set sv_maxRate "25000"
set g_inactivity "0"
