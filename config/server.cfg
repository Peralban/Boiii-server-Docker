// =====================================================================
//  server.cfg  -  MULTIPLAYER (t7x)
//  Aligned with the maintained t7x server config (lobby-based startup).
//  Values written as ${NAME} are injected from .env at startup.
//  Colors: ^1 red ^2 green ^3 yellow ^4 blue ^5 cyan ^6 pink ^7 white
// =====================================================================

// --- Server identity --------------------------------------------------
set sv_hostname "${SERVER_NAME}"
set live_steam_server_name "${SERVER_NAME}"
set live_steam_server_description "${SERVER_DESCRIPTION}"
set g_password "${SERVER_PASSWORD}"
set rcon_password "${RCON_PASSWORD}"

// --- Session / networking --------------------------------------------
set com_maxclients "${MAX_PLAYERS}"
set sv_maxclients "${MAX_PLAYERS}"
set sv_privateClients "0"
// sv_lobby_mode sets up the proper MP session (loadouts/classes). Without it
// combined with the lobby script, players spawn with no weapons.
set sv_lobby_mode "mp"
// Load the starting map immediately (first entry of sv_maprotation below).
set sv_skip_lobby "1"
set sv_lanonly "0"
set sv_pure "0"
set sv_timeout "30"
set sv_reconnectlimit "3"
set sv_floodProtect "1"
set g_log "logs/games_mp.log"

// --- Gametype rules ---------------------------------------------------
// Loads the settings for the mode. Match it to the first gametype in the
// rotation below (gamesettings_tdm.cfg for tdm, _dom.cfg for dom, etc.).
exec "gamedata/gamesettings/mp/gamesettings_tdm.cfg"
set scr_teambalance "1"
set cg_thirdPerson "0"
set g_deadChat "0"

// --- Bots -------------------------------------------------------------
// Bots fill the teams once a human is on the server.
// Difficulty: 0=easy, 1=normal, 2=hard, 3=veteran
set bot_maxallies "4"
set bot_maxAxis "4"
set bot_maxFree "8"
set bot_difficulty "1"

// --- Map rotation -----------------------------------------------------
// The FIRST "gametype X map Y" pair is the starting gametype + map.
// Common maps: mp_veiled (Fringe), mp_havoc, mp_infection, mp_nuketown_x,
//              mp_redwood, mp_skyjacked, mp_biodome (Aquarium).
set sv_maprotation "gametype tdm map mp_veiled map mp_havoc map mp_nuketown_x map mp_infection"
