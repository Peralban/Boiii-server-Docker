// =====================================================================
//  server_snipe1v1.cfg  -  PRESET: 1v1 snipers, Nuketown, FFA, radar always on
//  Values written as ${NAME} are injected from .env at startup.
//
//  To use this preset: SERVER_CFG=server_snipe1v1.cfg in .env
//  (or: .\switch.ps1 snipe1v1 / ./switch.sh snipe1v1), then:
//      docker compose up -d
// =====================================================================

// --- Server identity --------------------------------------------------
set sv_hostname "${SERVER_NAME}"
set live_steam_server_name "${SERVER_NAME}"
set live_steam_server_description "${SERVER_DESCRIPTION}"
set g_password "${SERVER_PASSWORD}"
set rcon_password "${RCON_PASSWORD}"

// --- Session / networking (1v1) ---------------------------------------
set com_maxclients "2"
set sv_maxclients "2"
set sv_privateClients "0"
set sv_lobby_mode "mp"
set sv_skip_lobby "1"
set sv_lanonly "0"
set sv_pure "0"
set sv_timeout "30"
set sv_reconnectlimit "3"
set sv_floodProtect "1"
set g_log "logs/games_mp.log"

// --- Rules: FFA + sniper-only restrictions ------------------------------
// The engine auto-reloads gamesettings_dm.cfg itself whenever g_gametype is
// "dm", AFTER anything manually exec'd here — so the sniper restrictions,
// forceRadar and timelimit=0 for this preset live directly in that file
// (t7x/gamesettings/mp/gamesettings_dm.cfg), not in a separate custom file.
set g_gametype "dm"
exec "gamedata/gamesettings/mp/gamesettings_dm.cfg"

set scr_teambalance "0"
set cg_thirdPerson "0"
set g_deadChat "0"

// No bots in a real 1v1 (FFA bot fill isn't reliable on this client anyway —
// confirmed working only in team-based modes like the 7v7bots preset).
set bot_maxallies "0"
set bot_maxAxis "0"
set bot_maxFree "0"

// --- Map: Nuketown only -------------------------------------------------
set sv_maprotation "gametype dm map mp_nuketown_x"
