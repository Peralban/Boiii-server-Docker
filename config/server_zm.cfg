// =====================================================================
//  server_zm.cfg  -  ZOMBIES (t7x)
//  Aligned with the maintained t7x server config (lobby-based startup).
//  Values written as ${NAME} are injected from .env at startup.
//
//  To run zombies: set SERVER_CFG=server_zm.cfg in .env (or use switch.sh zm).
// =====================================================================

// --- Server identity --------------------------------------------------
set sv_hostname "${SERVER_NAME}"
set live_steam_server_name "${SERVER_NAME}"
set live_steam_server_description "${SERVER_DESCRIPTION}"
set g_password "${SERVER_PASSWORD}"
set rcon_password "${RCON_PASSWORD}"

// --- Session / networking (zombies is 1-4 players) -------------------
set com_maxclients "4"
set sv_maxclients "4"
set sv_privateClients "0"
set sv_lobby_mode "zm"
set sv_skip_lobby "1"
set sv_lanonly "0"
set sv_pure "0"
set sv_timeout "30"
set sv_reconnectlimit "3"
set sv_floodProtect "1"
set g_log "logs/games_zm.log"

// --- Zombies rules (leave these execs as-is) -------------------------
exec "gamedata/gamesettings/zm/gamesettings_default.cfg"
exec "gamedata/configs/common/default_xboxlive.cfg"
exec "gamedata/gamesettings/zm/gamesettings_zclassic.cfg"

// --- Map rotation -----------------------------------------------------
// First "gametype zclassic map X" = the starting map. Map codenames:
//   zm_zod (Shadows of Evil)   zm_factory (The Giant)    zm_castle (Der Eisendrache)
//   zm_island (Zetsubou)       zm_stalingrad (Gorod)     zm_genesis (Revelations)
//   zm_tomb (Origins)          zm_prototype (Nacht)      zm_sumpf (Shi No Numa)
//   zm_asylum (Verruckt)       zm_theater (Kino)         zm_cosmodrome (Ascension)
//   zm_temple (Shangri-La)     zm_moon (Moon)
set sv_maprotation "gametype zclassic map zm_tomb"
