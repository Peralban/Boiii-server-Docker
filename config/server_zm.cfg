// =====================================================================
//  server_zm.cfg  -  ZOMBIES (BO3 / custom client)
//
//  Values written as ${NAME} are injected from your .env file at startup.
//
//  To run zombies: set SERVER_CFG=server_zm.cfg in .env, then:
//      docker compose up -d
// =====================================================================

// --- Server identity --------------------------------------------------
set sv_hostname "${SERVER_NAME}"
set live_steam_server_name "${SERVER_NAME}"
set live_steam_server_description "${SERVER_DESCRIPTION}"

// Password required to join (empty = open server)
set g_password "${SERVER_PASSWORD}"

// --- Remote administration (RCON) ------------------------------------
set rcon_password "${RCON_PASSWORD}"

// --- Players ----------------------------------------------------------
// Zombies co-op supports 1 to 4 players.
set sv_maxclients "4"
set party_maxplayers "4"

// --- Starting map -----------------------------------------------------
// Shadows of Evil = zm_zod, The Giant = zm_factory.
// Maps from Zombies Chronicles (e.g. zm_tomb) are NOT part of the
// dedicated server download: their .ff/.fd files must be copied in from
// a full game installation.
set g_gametype "zclassic"
map zm_zod

// --- Misc -------------------------------------------------------------
set sv_maxRate "25000"
