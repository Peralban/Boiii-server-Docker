// =====================================================================
//  server_7v7bots.cfg  -  PRESET: 7v7 TDM, bots fill empty slots
//  Values written as ${NAME} are injected from .env at startup.
//
//  To use this preset: SERVER_CFG=server_7v7bots.cfg in .env
//  (or: .\switch.ps1 7v7bots / ./switch.sh 7v7bots), then:
//      docker compose up -d
//
//  bot_maxallies/bot_maxAxis are a per-team CAP, not a fixed add-on: bots
//  fill empty slots up to 7 per team, so as real players join, fewer bots
//  spawn (down to 0 once 7 humans are on a team).
// =====================================================================

// --- Server identity --------------------------------------------------
set sv_hostname "${SERVER_NAME}"
set live_steam_server_name "${SERVER_NAME}"
set live_steam_server_description "${SERVER_DESCRIPTION}"
set g_password "${SERVER_PASSWORD}"
set rcon_password "${RCON_PASSWORD}"

// --- Session / networking (7v7 = 14 slots) -----------------------------
set com_maxclients "14"
set sv_maxclients "14"
set sv_privateClients "0"
set sv_lobby_mode "mp"
set sv_skip_lobby "1"
set sv_lanonly "0"
set sv_pure "0"
set sv_timeout "30"
set sv_reconnectlimit "3"
set sv_floodProtect "1"
set g_log "logs/games_mp.log"

// --- Rules: standard TDM ------------------------------------------------
set g_gametype "tdm"
exec "gamedata/gamesettings/mp/gamesettings_tdm.cfg"
set scr_teambalance "1"
set cg_thirdPerson "0"
set g_deadChat "0"

// --- Bots: cap each team at 7 (real players + bots) ---------------------
// Difficulty: 0=easy, 1=normal, 2=hard, 3=veteran
set bot_maxallies "7"
set bot_maxAxis "7"
set bot_maxFree "0"
set bot_difficulty "1"

// --- Map rotation -------------------------------------------------------
set sv_maprotation "gametype tdm map mp_veiled map mp_havoc map mp_nuketown_x map mp_infection"
